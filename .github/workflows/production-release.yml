name: OpenAI Sites release gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openai-sites-production
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild release commit
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ASSISTANT_ENABLED: 'false'
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Foundation tests
        run: npm run test:foundation

      - name: Assistant tests (no live API)
        run: npm run test:assistant

      - name: Assistant critical eval gate (no live API)
        run: npm run eval:assistant

      - name: Validate recipes
        run: npm run validate:recipes

      - name: Build without runtime secrets
        run: npm run build

  authorize-sites-deploy:
    name: Authorize manual Sites deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      ASSISTANT_ENABLED: ${{ vars.ASSISTANT_ENABLED }}
      ASSISTANT_MAX_OUTPUT_TOKENS: ${{ vars.ASSISTANT_MAX_OUTPUT_TOKENS }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      OPENAI_API_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
      ASSISTANT_SESSION_SECRET_CONFIGURED: ${{ secrets.ASSISTANT_SESSION_SECRET != '' }}
    steps:
      - name: Check out release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate protected production configuration
        run: node scripts/validate-production-config.mjs

      - name: Record approved commit
        run: echo "OpenAI Sites deploy is authorized for commit ${GITHUB_SHA}. Deploy this exact commit through the Sites runtime, then run the post-deploy smoke workflow."
