name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      ASSISTANT_ENABLED: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Analytics privacy tests
        run: npm run test:analytics

      - name: Foundation tests
        run: npm run test:foundation

      - name: Assistant tests (no live API)
        run: npm run test:assistant

      - name: Assistant critical eval gate (no live API)
        run: npm run eval:assistant

      - name: Validate recipes
        run: npm run validate:recipes

      - name: Production build without secrets
        run: npm run build
